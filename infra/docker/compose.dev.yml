# Besonc local development stack.
#
# RAM NOTE: this sandbox has ~2 GB. Do NOT bring everything up at once.
# Services are grouped into profiles — start only what you're working on.
#
#   core     postgres + redis            (always needed)
#   broker   rabbitmq
#   storage  minio
#   obs      jaeger
#
#   docker compose -f infra/docker/compose.dev.yml --profile core up -d
#   docker compose -f infra/docker/compose.dev.yml --profile core --profile broker up -d
#
# Databases are separated by DATABASE, not by container, to fit in RAM.
# In staging/production each service gets its own Postgres instance
# (MASTER_PLAN §1.2.1 — database-per-service).

name: besonc-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    profiles: [core]
    environment:
      POSTGRES_PASSWORD: besonc_dev
      POSTGRES_USER: besonc
      POSTGRES_MULTIPLE_DATABASES: >-
        identity,catalogue,order,pricing,dispatch,payment,messaging,media,admin,tracking
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U besonc"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources: { limits: { memory: 512M } }

  redis:
    image: redis:7-alpine
    profiles: [core]
    command: redis-server --save 60 1 --loglevel warning --maxmemory 192mb --maxmemory-policy noeviction
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources: { limits: { memory: 256M } }

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: [broker]
    environment:
      RABBITMQ_DEFAULT_USER: besonc
      RABBITMQ_DEFAULT_PASS: besonc_dev
    ports: ["5672:5672", "15672:15672"]
    volumes: [mqdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources: { limits: { memory: 512M } }

  minio:
    image: minio/minio:latest
    profiles: [storage]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: besonc
      MINIO_ROOT_PASSWORD: besonc_dev_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    deploy:
      resources: { limits: { memory: 256M } }

  jaeger:
    image: jaegertracing/all-in-one:1.62
    profiles: [obs]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317", "4318:4318"]
    deploy:
      resources: { limits: { memory: 384M } }

volumes:
  pgdata:
  redisdata:
  mqdata:
  miniodata:
