name: besonc_chat
description: Order chat shared by the customer and rider apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  besonc_api:
    path: ../besonc_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Real virtual clock. An earlier version of the specs used a hand-rolled
  # no-op shim, which meant the polling tests passed without advancing any
  # timer at all — a green light that could never go red.
  fake_async: ^1.3.1
  flutter_lints: ^5.0.0


flutter:
